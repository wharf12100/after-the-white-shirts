<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>志願役占比猜猜看</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  /* Deliberately single-theme: this chart always reads as a clean white
     dossier page, regardless of the viewer's OS dark/light setting. */
  :root{
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f3f4f1;
    --ink: #1c211a;
    --ink-soft: #4d564a;
    --muted: #838d7f;
    --hair: #e4e7e0;
    --guess: #2f8fd8;
    --guess-soft: #e4f1fb;
    --actual: #c23b5a;
    --actual-soft: #fbe6ea;
    --accent: #3f5a34;
    --shadow: 0 18px 40px -26px rgba(30,42,31,.28);
    --radius: 18px;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:4px 12px;
    overflow:hidden;
    min-height:100vh;
    display:grid;
    align-items:start;
  }

  .wrap{
    max-width:880px;
    margin:0 auto;
  }

  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:clamp(26px,4.2vw,38px);
    line-height:1.25;
    margin:10px 0 8px;
    text-wrap:balance;
    letter-spacing:.01em;
  }

  .lede{
    color:var(--ink-soft);
    font-size:15.5px;
    line-height:1.75;
    max-width:62ch;
    margin:0 0 26px;
  }
  .lede b{color:var(--ink);font-weight:700;}

  .card{
    background:var(--surface);
    border-radius:0;
    box-shadow:none;
    border:0;
    padding:8px 12px 8px;
  }

  .banner{
    display:flex;
    gap:14px;
    align-items:flex-start;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .banner .icon{
    font-family:"IBM Plex Mono",monospace;
    font-weight:700;
    font-size:13px;
    color:currentColor;
    background:var(--surface);
    border:1.5px solid currentColor;
    border-radius:50%;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .banner p{
    margin:0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
  }
  #taskBanner p{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    color:#78766A;
  }
  .banner strong{color:var(--ink);}
  .banner--guess{
    background:var(--guess-soft);
    border:1px solid color-mix(in srgb, var(--guess) 35%, transparent);
    color:var(--guess);
  }

  .banner--actual{
    background:var(--actual-soft);
    border:1px solid color-mix(in srgb, var(--actual) 35%, transparent);
    color:var(--actual);
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
    margin:0 0 6px;
    font-size:14px;
    color:var(--ink-soft);
  }
  .legend .item{display:flex;align-items:center;gap:7px;transition:opacity .3s;}
  .legend .item.dim{opacity:.35;}
  .legend .swatch{width:20px;height:0;border-top-width:4px;border-top-style:solid;display:inline-block;}
  .legend .swatch.dash{border-top-style:dashed;}

  .chart-shell{
    position:relative;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    cursor:crosshair;
  }
  .chart-shell.locked{cursor:default;}

  svg{display:block;width:100%;height:auto;}

  .axis-label{
    font-family:"IBM Plex Mono",monospace;
    font-size:13px;
    fill:var(--muted);
  }
  .axis-title{
    font-family:"Noto Sans TC",sans-serif;
    font-size:14px;
    font-weight:700;
    fill:var(--ink-soft);
  }
  .gridline{stroke:var(--hair);stroke-width:1;}
  .zone-fill{fill:var(--guess-soft); opacity:.5;}

  .hint-text{
    font-family:"Noto Sans TC",sans-serif;
    font-size:14px;
    font-weight:500;
    fill:var(--guess);
  }

  .pt{stroke:var(--surface);stroke-width:2;}
  .start-anchor{
    fill:var(--surface);
    stroke:var(--guess);
    stroke-width:3;
    transform-box:fill-box;
    transform-origin:center;
    animation:startPulse 1.55s ease-in-out infinite;
  }
  .chart-shell.has-started .start-anchor{animation:none;}
  @keyframes startPulse{
    0%,100%{transform:scale(.9);opacity:.72;}
    50%{transform:scale(1.24);opacity:1;}
  }

  .end-label{
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:14px;
  }

  .anno-tag{
    font-family:"Noto Sans TC",sans-serif;
    font-weight:700;
    font-size:13.5px;
  }
  .anno-bg{
    fill:var(--surface);
    opacity:.92;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-top:18px;
  }

  button{
    font-family:"Noto Sans TC",sans-serif;
    font-weight:400;
    font-size:14px;
    border-radius:999px;
    padding:5px 9px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--surface);
    cursor:pointer;
    transition:transform .15s ease, opacity .2s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
  }
  button.ghost{
    background:transparent;
    color:var(--ink);
    border-color:var(--hair);
  }
  button:focus-visible{outline:3px solid var(--guess);outline-offset:2px;}

  .status:empty{display:none;}

  .status{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    color:var(--muted);
  }

  .reveal{
    display:block;
    margin-top:20px;
    padding-top:18px;
    border-top:1px dashed var(--hair);
  }
  .reveal.show{display:block;}

  .score-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .score-tile{
    flex:1 1 180px;
    background:var(--surface-2);
    border-radius:12px;
    padding:8px 14px;
  }
  .score-tile .k{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    color:#78766A;
    font-weight:400;
  }
  .score-tile .v{
    font-family:"IBM Plex Mono",monospace;
    font-size:20px;
    font-weight:600;
    margin-top:2px;
    color:var(--ink);
  }
  .score-tile.hero .v{color:var(--muted);}
  .reveal .score-tile .v{color:var(--muted);}
  .reveal.show .score-tile .v{color:var(--actual);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>


<div class="wrap">
  <div class="card">
    <div class="banner banner--guess" id="taskBanner">
      <span class="icon">?</span>
      <p>圖中已標出 2013 年的起點（71.25%）。在<strong>淺藍色區塊</strong>中，用滑鼠或手指<strong>由左（2013）往右（2024）拖曳</strong>畫出你猜測的志願役占比曲線。畫滿整段後，「公布真實數據」按鈕就會亮起。</p>
    </div>

    <div class="banner banner--actual" id="calloutBanner" style="display:none;">
      <span class="icon">!</span>
      <p><strong>轉折在 2024 年：</strong>解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋解釋......</p>
    </div>

    <div class="legend">
      <span class="item" id="legend-guess"><span class="swatch dash" style="border-color:var(--guess)"></span>你的猜測</span>
      <span class="item dim" id="legend-actual"><span class="swatch" style="border-color:var(--actual)"></span>真實數據</span>
    </div>

    <div class="chart-shell" id="chartShell">
      <svg id="chart" viewBox="0 0 820 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="志願役占比互動圖表：拖曳畫出 2013 到 2024 年的預測線"></svg>
    </div>

    <div class="controls">
      <button id="revealBtn" disabled>公布真實數據</button>
      <button class="ghost" id="resetBtn">重畫一次</button>
      <span class="status" id="statusText"></span>
    </div>

    <div class="reveal" id="revealPanel">
      <div class="score-row">
        <div class="score-tile">
          <div class="k">2024 志願役占比（人數）</div>
          <div class="v" id="volValue">？？？</div>
        </div>
        <div class="score-tile hero">
          <div class="k">2024 義務役占比（人數）</div>
          <div class="v" id="consValue">？？？</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const data = [
    {y:2013, roc:102, vol:124758, volPct:71.25, cons:50333, consPct:28.75},
    {y:2014, roc:103, vol:130714, volPct:78.29, cons:36247, consPct:21.71},
    {y:2015, roc:104, vol:139268, volPct:77.14, cons:41292, consPct:22.86},
    {y:2016, roc:105, vol:144691, volPct:90.10, cons:15953, consPct:9.90},
    {y:2017, roc:106, vol:146785, volPct:97.27, cons:4121,  consPct:2.73},
    {y:2018, roc:107, vol:155412, volPct:99.99, cons:9,     consPct:0.01},
    {y:2019, roc:108, vol:162039, volPct:99.997,cons:5,     consPct:0.003},
    {y:2020, roc:109, vol:164063, volPct:99.999,cons:1,     consPct:0.001},
    {y:2021, roc:110, vol:164884, volPct:100,   cons:0,     consPct:0},
    {y:2022, roc:111, vol:159392, volPct:100,   cons:0,     consPct:0},
    {y:2023, roc:112, vol:154686, volPct:100,   cons:0,     consPct:0},
    {y:2024, roc:113, vol:152885, volPct:98.39, cons:2505,  consPct:1.61},
  ];

  const peakIndex = 5;  // 2018 — the peak worth calling out
  const dipIndex = 11;  // 2024 — the reversal worth calling out
  const years = data.map(d=>d.y);
  const W = 820, H = 440;
  const M = {top:18, right:26, bottom:56, left:58};
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;

  const yMin = 60, yMax = 102;
  function xScale(year){ return M.left + (year - years[0])/(years[years.length-1]-years[0]) * plotW; }
  function yScale(val){ return M.top + (1 - (val - yMin)/(yMax-yMin)) * plotH; }
  function yInv(py){ const t = 1 - (py - M.top)/plotH; return yMin + t*(yMax-yMin); }

  const svg = document.getElementById('chart');
  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(ns, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // gridlines + axis tick labels
  const gGrid = el('g',{});
  [60,70,80,90,100].forEach(v=>{
    const ly = yScale(v);
    gGrid.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:ly,y2:ly,class:'gridline'}));
    const t = el('text',{x:M.left-8,y:ly+4,class:'axis-label','text-anchor':'end'});
    t.textContent = v+'%';
    gGrid.appendChild(t);
  });
  years.forEach(yr=>{
    const t = el('text',{x:xScale(yr), y:H-M.bottom+22, class:'axis-label','text-anchor':'middle'});
    t.textContent = yr;
    gGrid.appendChild(t);
  });
  svg.appendChild(gGrid);

  // axis titles
  const yAxisTitle = el('text',{
    x: 11, y: M.top + plotH / 2 - 40,
    class:'axis-title', 'text-anchor':'middle'
  });
  [...'志願役佔比'].forEach((char, index)=>{
    const line = el('tspan',{x:11, dy:index === 0 ? 0 : 16});
    line.textContent = char;
    yAxisTitle.appendChild(line);
  });
  const yAxisUnit = el('tspan',{x:11, dy:16});
  yAxisUnit.textContent = '（%）';
  yAxisTitle.appendChild(yAxisUnit);
  svg.appendChild(yAxisTitle);

  const xAxisTitle = el('text',{
    x: M.left+plotW/2, y: H-8,
    class:'axis-title', 'text-anchor':'middle'
  });
  xAxisTitle.textContent = '年份（西元）';
  svg.appendChild(xAxisTitle);

  // shaded guess zone spans the whole chart now — the user draws from year one
  const zoneX0 = xScale(years[0]);
  const zoneX1 = xScale(years[years.length-1]);
  svg.appendChild(el('rect',{x:zoneX0, y:M.top, width:zoneX1-zoneX0, height:plotH, class:'zone-fill'}));
  const hint = el('text',{x:(zoneX0+zoneX1)/2, y:M.top+20, class:'hint-text','text-anchor':'middle', style:'transition:opacity .4s ease'});
  hint.textContent = '在這裡拖曳畫線，從 2013 畫到 2024 →';
  svg.appendChild(hint);

  function pathFor(pts){
    return pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(2)+' '+p.y.toFixed(2)).join(' ');
  }

  // fixed starting anchor — the one point everyone starts from: 2013, 71.25%
  const startPt = {x:xScale(data[0].y), y:yScale(data[0].volPct)};
  svg.appendChild(el('circle',{cx:startPt.x, cy:startPt.y, r:6, class:'start-anchor'}));

  // user guess path (drawn live) — thicker stroke for a hand-drawn feel, no per-point dots
  const guessPath = el('path',{d:'', fill:'none', stroke:'var(--guess)','stroke-width':5,'stroke-dasharray':'9 7','stroke-linecap':'round','stroke-linejoin':'round'});
  svg.appendChild(guessPath);

  // actual reveal path (hidden initially) — thicker stroke, solid
  const actualPath = el('path',{d:'', fill:'none', stroke:'var(--actual)','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round', opacity:0});
  svg.appendChild(actualPath);
  const actualDotsGroup = el('g',{});
  svg.appendChild(actualDotsGroup);
  const annoGroup = el('g',{opacity:0});
  svg.appendChild(annoGroup);

  function addAnnotation(idx, lines, preferAbove){
    const px = xScale(data[idx].y);
    const py = yScale(data[idx].volPct);
    const tagW = Math.max(...lines.map(l=>l.length))*7.6 + 16;
    const tagH = lines.length*15 + 10;
    const gap = 14;
    let tagY = preferAbove ? (py - gap - tagH) : (py + gap);
    tagY = clampAnno(tagY, 4, H - M.bottom - tagH - 4);
    const tagX = clampAnno(px - tagW/2, M.left, W-M.right-tagW);
    const connectY = (tagY + tagH <= py) ? tagY + tagH : (tagY >= py ? tagY : py);
    const g = el('g',{});
    g.appendChild(el('line',{x1:px, y1:py, x2:px, y2:connectY, stroke:'var(--actual)','stroke-width':1,'stroke-dasharray':'2 3'}));
    g.appendChild(el('rect',{x:tagX, y:tagY, width:tagW, height:tagH, rx:8, class:'anno-bg', stroke:'var(--actual)', 'stroke-width':1}));
    lines.forEach((line,i)=>{
      const t = el('text',{x:tagX+8, y:tagY+16+i*15, class:'anno-tag', fill:'var(--actual)'});
      t.textContent = line;
      g.appendChild(t);
    });
    return g;
  }
  function clampAnno(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  // interaction
  const shell = document.getElementById('chartShell');
  let drawing = false;
  let rawPoints = [];
  let guessValues = null;
  let revealed = false;

  const statusText = document.getElementById('statusText');
  const revealBtn = document.getElementById('revealBtn');
  const resetBtn = document.getElementById('resetBtn');

  function svgPoint(evt){
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    const px = (clientX - rect.left) / rect.width * W;
    const py = (clientY - rect.top) / rect.height * H;
    return {px, py};
  }

  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

  function updateGuessFromRaw(){
    if(rawPoints.length < 2){ guessPath.setAttribute('d',''); return; }
    const sorted = rawPoints.slice().sort((a,b)=>a.x-b.x);
    guessPath.setAttribute('d', pathFor(sorted));

    const vals = [];
    for(let i=0; i<data.length; i++){
      const targetX = clamp(xScale(data[i].y), sorted[0].x, sorted[sorted.length-1].x);
      let val = null;
      for(let j=0;j<sorted.length-1;j++){
        if(sorted[j].x<=targetX && sorted[j+1].x>=targetX){
          const t = (targetX-sorted[j].x)/((sorted[j+1].x-sorted[j].x)||1);
          const py = sorted[j].y + t*(sorted[j+1].y-sorted[j].y);
          val = clamp(yInv(py), 0, 100);
          break;
        }
      }
      if(val===null){
        const nearest = sorted.reduce((a,b)=> Math.abs(b.x-targetX)<Math.abs(a.x-targetX)?b:a);
        val = clamp(yInv(nearest.y),0,100);
      }
      vals.push(val);
    }
    guessValues = vals;

    const zoneWidth = zoneX1 - zoneX0;
    const coveredWidth = sorted[sorted.length-1].x - sorted[0].x;
    const coveredEnough = coveredWidth >= zoneWidth * 0.6;

    if(coveredEnough){
      revealBtn.disabled = false;
      statusText.textContent = '';
    } else {
      revealBtn.disabled = true;
      statusText.textContent = '';
    }
  }

  function pointerDown(evt){
    if(revealed) return;
    const p = svgPoint(evt);
    const startsAtAnchor = Math.hypot(p.px - startPt.x, p.py - startPt.y) <= 24;
    if(!startsAtAnchor) return;
    drawing = true;
    rawPoints = [{x:startPt.x, y:startPt.y}];
    shell.classList.add('has-started');
    shell.setPointerCapture && evt.pointerId!=null && shell.setPointerCapture(evt.pointerId);
    handleMove(evt);
    evt.preventDefault();
  }
  function pointerMove(evt){
    if(!drawing || revealed) return;
    handleMove(evt);
    evt.preventDefault();
  }
  function pointerUp(){
    drawing = false;
  }
  function handleMove(evt){
    const p = svgPoint(evt);
    const cx = clamp(p.px, zoneX0, zoneX1);
    const cy = clamp(p.py, M.top, H-M.bottom);
    rawPoints.push({x:cx, y:cy});
    if(rawPoints.length > 4000) rawPoints.shift();
    updateGuessFromRaw();
  }

  shell.addEventListener('pointerdown', pointerDown);
  shell.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  shell.addEventListener('touchstart', pointerDown, {passive:false});
  shell.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend', pointerUp);

  function resetGuess(){
    rawPoints = [];
    guessValues = null;
    guessPath.setAttribute('d','');
    revealBtn.disabled = true;
    revealed = false;
    shell.classList.remove('locked');
    shell.classList.remove('has-started');
    statusText.textContent = '';
    document.getElementById('volValue').textContent = '？？？';
    document.getElementById('consValue').textContent = '？？？';
    actualPath.setAttribute('opacity',0);
    actualDotsGroup.innerHTML = '';
    annoGroup.innerHTML = '';
    annoGroup.setAttribute('opacity',0);
    hint.setAttribute('opacity', 1);
    document.getElementById('revealPanel').classList.remove('show');
    document.getElementById('legend-actual').classList.add('dim');
    document.getElementById('taskBanner').style.display = 'flex';
    document.getElementById('calloutBanner').style.display = 'none';
  }
  resetBtn.addEventListener('click', resetGuess);

  revealBtn.addEventListener('click', ()=>{
    if(!guessValues) return;
    revealed = true;
    shell.classList.add('locked');
    revealBtn.disabled = true;
    document.getElementById('legend-actual').classList.remove('dim');
    hint.setAttribute('opacity', 0);
    document.getElementById('taskBanner').style.display = 'none';
    document.getElementById('calloutBanner').style.display = 'flex';

    const pts = data.map(d=>({x:xScale(d.y), y:yScale(d.volPct)}));
    actualPath.setAttribute('d', pathFor(pts));
    actualPath.setAttribute('opacity',1);
    const len = actualPath.getTotalLength();
    actualPath.style.transition = 'none';
    actualPath.setAttribute('stroke-dasharray', len);
    actualPath.setAttribute('stroke-dashoffset', len);
    actualPath.getBoundingClientRect();
    requestAnimationFrame(()=>{
      actualPath.style.transition = 'stroke-dashoffset 1.6s ease';
      actualPath.setAttribute('stroke-dashoffset', 0);
    });

    setTimeout(()=>{
      pts.forEach(p=>actualDotsGroup.appendChild(el('circle',{cx:p.x,cy:p.y,r:4.5,fill:'var(--actual)',class:'pt', opacity:0})));
      Array.from(actualDotsGroup.children).forEach((c,i)=>{
        setTimeout(()=>{ c.setAttribute('opacity',1); }, i*70);
      });

      annoGroup.setAttribute('opacity',0);
    }, 1650);

    setTimeout(()=>{
      const panel = document.getElementById('revealPanel');
      document.getElementById('volValue').textContent = '98.39%（152,885人）';
      document.getElementById('consValue').textContent = '1.61%（2,505人）';
      panel.classList.add('show');
    }, 1750);
  });
})();
</script>

</body>
</html>
