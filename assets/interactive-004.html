<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>志願役佔比猜猜看</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  /* 與「國防預算分配佔比」圖卡同一套設計：米色底、紅／金／墨綠配色、Space Mono 標註 */
  :root{
    color-scheme: light;
    --bg: #F5F0E2;
    --surface: #F5F0E2;
    --surface-2: #ECE4D1;
    --ink: #302E29;
    --ink-soft: #58544B;
    --muted: #716B60;
    --hair: rgba(110,101,85,.22);
    --rule: #BFB6A4;
    --guess: #4F6B61;
    --guess-soft: rgba(79,107,97,.10);
    --actual: #984B3E;
    --actual-soft: rgba(152,75,62,.09);
    --mono: 'Space Mono', monospace;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light; background:var(--bg);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0;
    overflow:hidden;
  }

  .wrap{ width:100%; margin:0; }
  .card{ background:transparent; border:0; padding:0; }

  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-start;
    gap:9px 18px;
    margin:0 0 18px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend .item{display:inline-flex;align-items:center;gap:6px;transition:opacity .3s;}
  .legend .item.dim{opacity:.35;}
  .legend .swatch{width:16px;height:9px;display:inline-block;}
  .legend .swatch.guess{background:repeating-linear-gradient(90deg, var(--guess) 0 5px, transparent 5px 8px);}
  .legend .swatch.actual{background:var(--actual);}

  .banner{
    display:flex;
    gap:12px;
    align-items:flex-start;
    border-radius:3px;
    padding:11px 14px;
    margin-bottom:14px;
  }
  .banner .icon{
    font-family:var(--mono);
    font-weight:700;
    font-size:11px;
    color:currentColor;
    background:transparent;
    border:1.5px solid currentColor;
    border-radius:50%;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .banner p{
    margin:0;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .banner strong{color:var(--ink);}
  .banner--guess{ background:var(--guess-soft); border-left:3px solid var(--guess); color:var(--guess); }
  .banner--actual{ background:var(--actual-soft); border-left:3px solid var(--actual); color:var(--actual); }

  .chart-shell{
    position:relative;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    cursor:crosshair;
    border-top:1px solid var(--rule);
    padding-top:8px;
  }
  .chart-shell.locked{cursor:default;}

  svg{display:block;width:100%;height:auto;}

  .axis-label{ font-family:var(--mono); font-size:11px; fill:var(--muted); }
  .axis-title{ font-family:var(--mono); font-size:11px; font-weight:400; fill:var(--muted); }
  .gridline{stroke:var(--hair);stroke-width:1;}
  .zone-fill{fill:var(--guess-soft);}

  .hint-text{ font-family:"Noto Sans TC",sans-serif; font-size:13px; font-weight:500; fill:var(--guess); }

  .pt{stroke:var(--surface);stroke-width:2;}
  .start-anchor{
    fill:var(--surface);
    stroke:var(--guess);
    stroke-width:3;
    transform-box:fill-box;
    transform-origin:center;
    animation:startPulse 1.55s ease-in-out infinite;
  }
  .chart-shell.has-started .start-anchor{animation:none;}
  @keyframes startPulse{
    0%,100%{transform:scale(.9);opacity:.72;}
    50%{transform:scale(1.24);opacity:1;}
  }

  .anno-tag{ font-family:"Noto Sans TC",sans-serif; font-weight:700; font-size:13px; }
  .anno-bg{ fill:var(--surface); opacity:.92; }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-top:14px;
  }

  button{
    font-family:var(--mono);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.06em;
    border-radius:3px;
    padding:7px 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--surface);
    cursor:pointer;
    transition:transform .15s ease, opacity .2s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button:disabled{ opacity:.35; cursor:not-allowed; transform:none; }
  button.ghost{ background:transparent; color:var(--ink); border-color:var(--rule); }
  button:focus-visible{outline:2px solid #7E3D31;outline-offset:3px;}

  .status:empty{display:none;}
  .status{ font-family:var(--mono); font-size:11px; color:var(--muted); }

  .reveal{
    display:block;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .reveal.show{display:block;}

  .score-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .score-tile{
    flex:1 1 180px;
    background:var(--surface-2);
    border-radius:3px;
    padding:9px 14px;
  }
  .score-tile .k{ font-family:var(--mono); font-size:10.5px; line-height:1.6; color:var(--muted); font-weight:400; }
  .score-tile .v{ font-family:var(--mono); font-size:19px; font-weight:700; margin-top:2px; color:var(--ink); }
  .score-tile.hero .v{color:var(--muted);}
  .reveal .score-tile .v{color:var(--muted);}
  .reveal.show .score-tile .v{color:var(--actual);}

  /* 電腦版（iframe 寬度較大時）：收緊間距，圖表高度略壓 */
  @media (min-width:680px){
    .legend{margin-bottom:10px;}
    .banner{padding:8px 12px; margin-bottom:8px;}
    .banner p{font-size:13px; line-height:1.6;}
    .chart-shell{padding-top:4px;}
    .controls{margin-top:6px;}
    .reveal{margin-top:10px; padding-top:10px;}
    .score-tile{padding:6px 12px;}
    .score-tile .v{font-size:17px;}
  }
  @media (max-width:560px){
    .banner p{font-size:12.5px;}
    .axis-label{font-size:20px;}
    .axis-title{font-size:20px;}
    .y-title{display:none;}
    .hint-text{font-size:22px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>


<div class="wrap">
  <div class="card">
    <div class="legend" aria-label="圖例">
      <span class="item" id="legend-guess"><span class="swatch guess"></span>你的猜測</span>
      <span class="item dim" id="legend-actual"><span class="swatch actual"></span>公布資料</span>
    </div>
    <div class="banner banner--guess" id="taskBanner">
      <span class="icon">?</span>
      <p>圖中已標出 2013 年的起點（71.25%）。在<strong>淺藍色區塊</strong>中，用滑鼠或手指<strong>由左（2013）往右（2026）拖曳</strong>畫出你猜測的志願役佔比曲線。畫滿整段後，「公布資料」按鈕就會亮起。</p>
    </div>

    <div class="banner banner--actual" id="calloutBanner" style="display:none;">
      <span class="icon">!</span>
      <p><strong>趨勢在近年再度轉折：</strong>2018 至 2023 年志願役佔比接近或達 100%；義務役佔比則由 2024 年的 1.7% 升至 2025 年的 3.4%，2026 年 4 月底預判為 4.6%。2024 年起的志願役佔比以 100% 扣除義務役佔比推算。</p>
    </div>


    <div class="chart-shell" id="chartShell">
      <svg id="chart" viewBox="0 0 820 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="志願役佔比互動圖表：拖曳畫出 2013 到 2026 年的預測線"></svg>
    </div>

    <div class="controls">
      <button id="revealBtn" disabled>公布資料</button>
      <button class="ghost" id="resetBtn">重畫一次</button>
      <span class="status" id="statusText"></span>
    </div>

    <div class="reveal" id="revealPanel">
      <div class="score-row">
        <div class="score-tile">
          <div class="k">2026 年 4 月底志願役佔比</div>
          <div class="v" id="volValue">？？？</div>
        </div>
        <div class="score-tile hero">
          <div class="k">2026 年 4 月底義務役佔比（入營人數）</div>
          <div class="v" id="consValue">？？？</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const data = [
    {y:2013, roc:102, vol:124758, volPct:71.25,  cons:50333, consPct:28.75,  forecast:false},
    {y:2014, roc:103, vol:130714, volPct:78.29,  cons:36247, consPct:21.71,  forecast:false},
    {y:2015, roc:104, vol:139268, volPct:77.14,  cons:41292, consPct:22.86,  forecast:false},
    {y:2016, roc:105, vol:144691, volPct:90.10,  cons:15953, consPct:9.90,   forecast:false},
    {y:2017, roc:106, vol:146785, volPct:97.27,  cons:4121,  consPct:2.73,   forecast:false},
    {y:2018, roc:107, vol:155412, volPct:99.99,  cons:9,     consPct:0.01,   forecast:false},
    {y:2019, roc:108, vol:162039, volPct:99.997, cons:5,     consPct:0.003,  forecast:false},
    {y:2020, roc:109, vol:164063, volPct:99.999, cons:1,     consPct:0.001,  forecast:false},
    {y:2021, roc:110, vol:164884, volPct:100,    cons:0,     consPct:0,      forecast:false},
    {y:2022, roc:111, vol:159392, volPct:100,    cons:0,     consPct:0,      forecast:false},
    {y:2023, roc:112, vol:154686, volPct:100,    cons:0,     consPct:0,      forecast:false},
    {y:2024, roc:113, volPct:98.3, cons:6956,  consPct:1.7, forecast:false},
    {y:2025, roc:114, volPct:96.6, cons:8291,  consPct:3.4, forecast:false},
    {y:2026, roc:115, volPct:95.4, cons:11472, consPct:4.6, forecast:true},
  ];

  const years = data.map(d=>d.y);
  const W = 820, H = window.innerWidth >= 680 ? 360 : 440;
  document.getElementById('chart').setAttribute('viewBox', `0 0 ${W} ${H}`);
  const M = {top:18, right:26, bottom:56, left:58};
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;

  const yMin = 60, yMax = 102;
  function xScale(year){ return M.left + (year - years[0])/(years[years.length-1]-years[0]) * plotW; }
  function yScale(val){ return M.top + (1 - (val - yMin)/(yMax-yMin)) * plotH; }
  function yInv(py){ const t = 1 - (py - M.top)/plotH; return yMin + t*(yMax-yMin); }

  const svg = document.getElementById('chart');
  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(ns, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // gridlines + axis tick labels
  const gGrid = el('g',{});
  [60,70,80,90,100].forEach(v=>{
    const ly = yScale(v);
    gGrid.appendChild(el('line',{x1:M.left,x2:W-M.right,y1:ly,y2:ly,class:'gridline'}));
    const t = el('text',{x:M.left-8,y:ly+4,class:'axis-label','text-anchor':'end'});
    t.textContent = v+'%';
    gGrid.appendChild(t);
  });
  years.forEach(yr=>{
    const t = el('text',{x:xScale(yr), y:H-M.bottom+22, class:'axis-label','text-anchor':'middle'});
    t.textContent = yr;
    gGrid.appendChild(t);
  });
  svg.appendChild(gGrid);

  // axis titles
  const yAxisTitle = el('text',{
    x: 11, y: M.top + plotH / 2 - 40,
    class:'axis-title y-title', 'text-anchor':'middle'
  });
  [...'志願役佔比'].forEach((char, index)=>{
    const line = el('tspan',{x:11, dy:index === 0 ? 0 : 16});
    line.textContent = char;
    yAxisTitle.appendChild(line);
  });
  const yAxisUnit = el('tspan',{x:11, dy:16});
  yAxisUnit.textContent = '（%）';
  yAxisTitle.appendChild(yAxisUnit);
  svg.appendChild(yAxisTitle);

  const xAxisTitle = el('text',{
    x: M.left+plotW/2, y: H-8,
    class:'axis-title', 'text-anchor':'middle'
  });
  xAxisTitle.textContent = '年份（西元）';
  svg.appendChild(xAxisTitle);

  // shaded guess zone spans the whole chart now — the user draws from year one
  const zoneX0 = xScale(years[0]);
  const zoneX1 = xScale(years[years.length-1]);
  svg.appendChild(el('rect',{x:zoneX0, y:M.top, width:zoneX1-zoneX0, height:plotH, class:'zone-fill'}));
  const hint = el('text',{x:(zoneX0+zoneX1)/2, y:M.top+20, class:'hint-text','text-anchor':'middle', style:'transition:opacity .4s ease'});
  hint.textContent = '在這裡拖曳畫線，從 2013 畫到 2026 →';
  svg.appendChild(hint);

  function pathFor(pts){
    return pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(2)+' '+p.y.toFixed(2)).join(' ');
  }

  // fixed starting anchor — the one point everyone starts from: 2013, 71.25%
  const startPt = {x:xScale(data[0].y), y:yScale(data[0].volPct)};
  svg.appendChild(el('circle',{cx:startPt.x, cy:startPt.y, r:6, class:'start-anchor'}));

  // user guess path (drawn live) — thicker stroke for a hand-drawn feel, no per-point dots
  const guessPath = el('path',{d:'', fill:'none', stroke:'var(--guess)','stroke-width':5,'stroke-dasharray':'9 7','stroke-linecap':'round','stroke-linejoin':'round'});
  svg.appendChild(guessPath);

  // actual reveal path (hidden initially) — thicker stroke, solid
  const actualPath = el('path',{d:'', fill:'none', stroke:'var(--actual)','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round', opacity:0});
  svg.appendChild(actualPath);
  const actualDotsGroup = el('g',{});
  svg.appendChild(actualDotsGroup);
  const annoGroup = el('g',{opacity:0});
  svg.appendChild(annoGroup);

  function addAnnotation(idx, lines, preferAbove){
    const px = xScale(data[idx].y);
    const py = yScale(data[idx].volPct);
    const tagW = Math.max(...lines.map(l=>l.length))*7.6 + 16;
    const tagH = lines.length*15 + 10;
    const gap = 14;
    let tagY = preferAbove ? (py - gap - tagH) : (py + gap);
    tagY = clampAnno(tagY, 4, H - M.bottom - tagH - 4);
    const tagX = clampAnno(px - tagW/2, M.left, W-M.right-tagW);
    const connectY = (tagY + tagH <= py) ? tagY + tagH : (tagY >= py ? tagY : py);
    const g = el('g',{});
    g.appendChild(el('line',{x1:px, y1:py, x2:px, y2:connectY, stroke:'var(--actual)','stroke-width':1,'stroke-dasharray':'2 3'}));
    g.appendChild(el('rect',{x:tagX, y:tagY, width:tagW, height:tagH, rx:8, class:'anno-bg', stroke:'var(--actual)', 'stroke-width':1}));
    lines.forEach((line,i)=>{
      const t = el('text',{x:tagX+8, y:tagY+16+i*15, class:'anno-tag', fill:'var(--actual)'});
      t.textContent = line;
      g.appendChild(t);
    });
    return g;
  }
  function clampAnno(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  // interaction
  const shell = document.getElementById('chartShell');
  let drawing = false;
  let rawPoints = [];
  let guessValues = null;
  let revealed = false;

  const statusText = document.getElementById('statusText');
  const revealBtn = document.getElementById('revealBtn');
  const resetBtn = document.getElementById('resetBtn');

  function svgPoint(evt){
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    const px = (clientX - rect.left) / rect.width * W;
    const py = (clientY - rect.top) / rect.height * H;
    return {px, py};
  }

  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

  function updateGuessFromRaw(){
    if(rawPoints.length < 2){ guessPath.setAttribute('d',''); return; }
    const sorted = rawPoints.slice().sort((a,b)=>a.x-b.x);
    guessPath.setAttribute('d', pathFor(sorted));

    const vals = [];
    for(let i=0; i<data.length; i++){
      const targetX = clamp(xScale(data[i].y), sorted[0].x, sorted[sorted.length-1].x);
      let val = null;
      for(let j=0;j<sorted.length-1;j++){
        if(sorted[j].x<=targetX && sorted[j+1].x>=targetX){
          const t = (targetX-sorted[j].x)/((sorted[j+1].x-sorted[j].x)||1);
          const py = sorted[j].y + t*(sorted[j+1].y-sorted[j].y);
          val = clamp(yInv(py), 0, 100);
          break;
        }
      }
      if(val===null){
        const nearest = sorted.reduce((a,b)=> Math.abs(b.x-targetX)<Math.abs(a.x-targetX)?b:a);
        val = clamp(yInv(nearest.y),0,100);
      }
      vals.push(val);
    }
    guessValues = vals;

    const zoneWidth = zoneX1 - zoneX0;
    const coveredWidth = sorted[sorted.length-1].x - sorted[0].x;
    const coveredEnough = coveredWidth >= zoneWidth * 0.6;

    if(coveredEnough){
      revealBtn.disabled = false;
      statusText.textContent = '';
    } else {
      revealBtn.disabled = true;
      statusText.textContent = '';
    }
  }

  function pointerDown(evt){
    if(revealed) return;
    const p = svgPoint(evt);
    const startsAtAnchor = Math.hypot(p.px - startPt.x, p.py - startPt.y) <= 24;
    if(!startsAtAnchor) return;
    drawing = true;
    rawPoints = [{x:startPt.x, y:startPt.y}];
    shell.classList.add('has-started');
    shell.setPointerCapture && evt.pointerId!=null && shell.setPointerCapture(evt.pointerId);
    handleMove(evt);
    evt.preventDefault();
  }
  function pointerMove(evt){
    if(!drawing || revealed) return;
    handleMove(evt);
    evt.preventDefault();
  }
  function pointerUp(){
    drawing = false;
  }
  function handleMove(evt){
    const p = svgPoint(evt);
    const cx = clamp(p.px, zoneX0, zoneX1);
    const cy = clamp(p.py, M.top, H-M.bottom);
    rawPoints.push({x:cx, y:cy});
    if(rawPoints.length > 4000) rawPoints.shift();
    updateGuessFromRaw();
  }

  shell.addEventListener('pointerdown', pointerDown);
  shell.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  shell.addEventListener('touchstart', pointerDown, {passive:false});
  shell.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend', pointerUp);

  function resetGuess(){
    rawPoints = [];
    guessValues = null;
    guessPath.setAttribute('d','');
    revealBtn.disabled = true;
    revealed = false;
    shell.classList.remove('locked');
    shell.classList.remove('has-started');
    statusText.textContent = '';
    document.getElementById('volValue').textContent = '？？？';
    document.getElementById('consValue').textContent = '？？？';
    actualPath.setAttribute('opacity',0);
    actualDotsGroup.innerHTML = '';
    annoGroup.innerHTML = '';
    annoGroup.setAttribute('opacity',0);
    hint.setAttribute('opacity', 1);
    document.getElementById('revealPanel').classList.remove('show');
    document.getElementById('legend-actual').classList.add('dim');
    document.getElementById('taskBanner').style.display = 'flex';
    document.getElementById('calloutBanner').style.display = 'none';
  }
  resetBtn.addEventListener('click', resetGuess);

  revealBtn.addEventListener('click', ()=>{
    if(!guessValues) return;
    revealed = true;
    shell.classList.add('locked');
    revealBtn.disabled = true;
    document.getElementById('legend-actual').classList.remove('dim');
    hint.setAttribute('opacity', 0);
    document.getElementById('taskBanner').style.display = 'none';
    document.getElementById('calloutBanner').style.display = 'flex';

    const pts = data.map(d=>({x:xScale(d.y), y:yScale(d.volPct)}));
    actualPath.setAttribute('d', pathFor(pts));
    actualPath.setAttribute('opacity',1);
    const len = actualPath.getTotalLength();
    actualPath.style.transition = 'none';
    actualPath.setAttribute('stroke-dasharray', len);
    actualPath.setAttribute('stroke-dashoffset', len);
    actualPath.getBoundingClientRect();
    requestAnimationFrame(()=>{
      actualPath.style.transition = 'stroke-dashoffset 1.6s ease';
      actualPath.setAttribute('stroke-dashoffset', 0);
    });

    setTimeout(()=>{
      pts.forEach(p=>actualDotsGroup.appendChild(el('circle',{cx:p.x,cy:p.y,r:4.5,fill:'var(--actual)',class:'pt', opacity:0})));
      Array.from(actualDotsGroup.children).forEach((c,i)=>{
        setTimeout(()=>{ c.setAttribute('opacity',1); }, i*70);
      });

      annoGroup.setAttribute('opacity',0);
    }, 1650);

    setTimeout(()=>{
      const panel = document.getElementById('revealPanel');
      document.getElementById('volValue').textContent = '95.4%';
      document.getElementById('consValue').textContent = '4.6%（預判 11,472 人）';
      panel.classList.add('show');
    }, 1750);
  });
  // 回報內容高度給外層頁面，讓 iframe 高度貼合內容
  const wrapEl = document.querySelector('.wrap');
  let lastH = 0;
  function reportHeight(){
    const h = Math.ceil(wrapEl.getBoundingClientRect().height);
    if(h && h !== lastH && window.parent !== window){
      lastH = h;
      window.parent.postMessage({type:'enlist-chart-height', height:h}, '*');
    }
  }
  if('ResizeObserver' in window) new ResizeObserver(reportHeight).observe(wrapEl);
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  reportHeight();
})();
</script>
