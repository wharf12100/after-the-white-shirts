<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>軍審權，如何離開又可能回到平時？</title>
  <style>
    :root{--ink:#292A28;--muted:#5b5c53;--paper:#F7F5EF;--paper2:#EDEAE0;--paper3:#E8E3D3;--line:#292A28;--line-soft:rgba(41,42,40,.18);--mil:#4B5240;--milsoft:#E4E8DE;--civil:#2f4f66;--civilsoft:#E3E9EE;--add:#EEF3E9;--addink:#3c4a30;--del:#F6EBE8;--delink:#7A2A28;--draft:#A9803F;--draftsoft:#F5EEDD;--gold:#A9803F;--focus:#7A2A28}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75;font-size:16px}
    button,a,summary{font:inherit}
    button{color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .eyebrow{margin:0 0 .5rem;font-size:.78rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
    .section-note{margin:.15rem 0 0;font-size:.72rem;font-weight:400;letter-spacing:0;color:var(--muted);line-height:1.6}

    main{display:block}
    .page-view[hidden]{display:none}
    .section{width:min(920px,calc(100% - 3rem));margin:0 auto;padding:2.6rem 0 .5rem}
    .section-cases{padding-top:2.6rem;padding-bottom:.5rem}
    .section-number{display:none}
    .section-intro{max-width:640px;margin:0 0 1.8rem}
    .section-intro h2{font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:clamp(1.5rem,3vw,2rem);line-height:1.3;margin:0 0 .6rem}
    .section-intro>p:last-child{color:var(--muted);font-size:.95rem;margin:0}

    /* 條文分頁 */
    .tabs{display:flex;gap:.4rem;border-bottom:1px solid var(--line-soft);margin-bottom:1.6rem;padding-bottom:0}
    .tabs button{border:1px solid var(--line-soft);background:var(--paper);border-radius:6px 6px 0 0;border-bottom:0;padding:.55rem 1rem;font-weight:700;font-size:.9rem;color:var(--muted)}
    .tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

    .diff-heading{margin-bottom:1rem}
    .diff-heading h3{margin:0 0 .2rem;font-family:"Noto Serif TC",serif;font-weight:700;font-size:1.3rem}
    .diff-heading p{margin:0;color:var(--muted);font-size:.9rem}

    /* 圖例 */
    .legend{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin:0 0 1.2rem;font-size:.82rem;color:var(--muted)}
    .legend-hint{font-size:.8rem;color:var(--muted)}
    .legend span{display:inline-flex;gap:.4rem;align-items:center;font-weight:700}
    .legend b{width:1.3rem;height:1.3rem;display:grid;place-items:center;background:var(--paper2);border-radius:4px}
    .legend .minus b{background:var(--del);color:var(--delink)}
    .legend .plus b{background:var(--add);color:var(--addink)}
    .legend .same b{color:var(--muted)}

    .change-nav{display:flex;justify-content:flex-end;margin-bottom:.8rem}

    /* 對照表頭：僅桌面顯示 */
    .diff-head{display:none}
    @media(min-width:681px){
      .diff-head{display:grid;grid-template-columns:1fr 2rem 1fr;gap:.5rem 1.2rem;padding:0 0 .5rem;margin-bottom:.4rem;border-bottom:1px solid var(--line-soft);font-size:.8rem;font-weight:700;color:var(--muted)}
      .diff-head span:last-child{grid-column:3}
      .diff-head-spacer{visibility:hidden}
    }

    #diff-body{display:flex;flex-direction:column;gap:1.6rem}
    .diff-row{display:block}
    .diff-row-label{display:flex;align-items:center;gap:.55rem;margin:0 0 .7rem;font-size:.82rem;font-weight:700;color:var(--muted)}
    .diff-row-index{display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;flex:0 0 auto;border-radius:50%;background:var(--paper2);color:var(--ink);font-size:.72rem;font-weight:700}
    .diff-row-cells{display:grid;grid-template-columns:1fr;gap:.8rem 1.2rem;align-items:start}
    .diff-row-connector{display:none}
    @media(min-width:681px){
      .diff-row-cells{grid-template-columns:1fr 2rem 1fr}
      .diff-row-connector{display:flex;align-self:center;justify-self:center;color:var(--muted);font-size:1.1rem}
    }

    .diff-cell{min-width:0}
    .diff-cell.empty{display:block}
    .mobile-label{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:.4rem}
    @media(min-width:681px){.mobile-label{display:none}}

    .legal-copy{display:flex;flex-direction:column;gap:.5rem}
    .piece{display:grid;grid-template-columns:1.4rem minmax(0,1fr);align-items:start;column-gap:.6rem;width:100%;border:1px solid transparent;border-radius:6px;padding:.75rem .9rem;text-align:left;white-space:pre-wrap;line-height:1.7;font-size:.82rem;background:var(--paper2)}
    .piece.deleted{background:var(--del);color:var(--delink)}
    .piece.added{background:var(--add);color:var(--addink)}
    .piece.same{background:rgba(235,231,221,.6);color:var(--ink)}
    .piece-button{cursor:pointer;position:relative;padding-right:2.1rem}
    .piece-button::after{content:"›";position:absolute;right:.8rem;top:50%;transform:translateY(-50%);font-weight:700;opacity:.35}
    .piece-button:hover{border-color:currentColor}
    .piece-button:hover::after,.piece-button:focus-visible::after{opacity:.9}
    .piece-button.is-active{border-color:currentColor}
    .piece-button.is-active::after{content:"✓";opacity:1;font-size:.85em}
    .piece .sign{grid-column:1;grid-row:1;align-self:center;position:relative;width:1.15rem;height:1.15rem;border:1.5px solid currentColor;border-radius:3px;font-size:0;line-height:1;display:inline-block}
    .piece .sign::before,.piece .sign::after{content:"";position:absolute;left:50%;top:50%;width:56%;height:1.5px;border-radius:99px;background:currentColor;transform:translate(-50%,-50%)}
    .piece.added .sign::after{width:1.5px;height:56%}
    .piece.deleted .sign::after{display:none}
    .piece.same .sign::before{top:39%}
    .piece.same .sign::after{top:61%}
    .piece-text{grid-column:2;grid-row:1;min-width:0}

    .effect{margin:0 0 1.2rem;padding:1.1rem 1.3rem;background:var(--paper2);border-radius:8px}
    .effect h3{font-family:"Noto Serif TC",serif;font-size:1.1rem;margin:0 0 .3rem}
    .effect #detail-plain{margin:0;max-width:720px;font-size:.92rem;line-height:1.7}
    .effect .eyebrow{margin-bottom:.35rem}
    #effect-dialog{margin:auto;width:min(520px,calc(100% - 2rem));max-height:none}
    .effect-dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.6rem}
    .effect-dialog-head .eyebrow{margin:0}
    #effect-dialog-close{border:1px solid var(--line-soft);background:transparent;width:1.8rem;height:1.8rem;border-radius:6px;font-size:1rem;line-height:1;cursor:pointer;flex:0 0 auto;color:var(--muted)}
    #effect-dialog-close:hover{border-color:var(--ink);color:var(--ink)}

    .pager{width:min(920px,calc(100% - 3rem));margin:0 auto .8rem;display:flex;justify-content:space-between;gap:1rem}
    .pager button{border:1px solid var(--line-soft);background:transparent;padding:.65rem 1.1rem;border-radius:6px;font-weight:700;font-size:.88rem}
    .pager button:hover{border-color:var(--ink)}
    .pager .next{margin-left:auto}

    dialog{width:min(760px,calc(100% - 2rem));max-height:85vh;border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);color:var(--ink);padding:1.4rem}
    dialog::backdrop{background:rgba(8,13,11,.6)}
    .dialog-head{display:flex;justify-content:space-between;gap:1rem;align-items:start;border-bottom:1px solid var(--line-soft);padding-bottom:.8rem;margin-bottom:1rem}
    .dialog-head h2{font-family:"Noto Serif TC",serif;font-size:1.2rem;margin:0}
    .dialog-head button{border:1px solid var(--line-soft);background:transparent;padding:.4rem .7rem;border-radius:6px;font-size:.82rem}
    
    /* 案件比較 */
    .case-controls{margin-bottom:1.4rem}
    .case-selector{display:flex;gap:.4rem;flex-wrap:wrap}
    .case-selector button{border:1px solid var(--line-soft);background:var(--paper);padding:.5rem .95rem;border-radius:20px;font-weight:700;font-size:.85rem;color:var(--muted)}
    .case-selector button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

    .case-grid{display:block}
    .case-card{background:#fffdf9;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
    .case-top{display:flex;justify-content:space-between;gap:1rem;font-size:.78rem;font-weight:700;color:var(--muted);padding:1.2rem 1.4rem 0}
    .case-card h3{font-family:"Noto Serif TC",serif;line-height:1.4;font-size:1.25rem;margin:.6rem 0 .2rem;padding:0 1.4rem}
    .person{margin:0;color:var(--muted);font-size:.85rem;padding:0 1.4rem}
    .facts{margin:.9rem 0;font-size:.92rem;line-height:1.75;padding:0 1.4rem}
    .question{font-weight:700;background:var(--paper2);margin:0 1.4rem 1.2rem;padding:.8rem 1rem;border-radius:6px;font-size:.92rem}
    .case-card details{margin:0 1.4rem 1.3rem;font-size:.85rem}
    .case-card summary{cursor:pointer;font-weight:700;color:var(--muted)}
    .case-card details ul{padding-left:1.2rem;font-size:.85rem;line-height:1.7;margin:.5rem 0}

    .outcome-col{border-top:1px solid var(--line-soft)}
    .outcome-row-label{margin:0;padding:1rem 1.4rem .3rem;font-size:.8rem;font-weight:700;color:var(--muted)}
    .outcome-row{display:flex;flex-direction:column}
    .outcome{padding:1rem 1.4rem;border-top:1px solid var(--line-soft)}
    .outcome.military{background:var(--milsoft)}
    .outcome.civil{background:var(--civilsoft)}
    .outcome.draft{background:var(--draftsoft)}
    .outcome-era{margin:0;font-size:.76rem;font-weight:700;color:var(--muted)}
    .outcome h4{font-family:"Noto Serif TC",serif;font-size:1.1rem;margin:.3rem 0 .5rem}
    .route{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.84rem;font-weight:700;margin-bottom:.5rem}
    .route span{padding:.15rem .4rem;background:var(--paper);border-radius:4px}
    .outcome-reason{margin:0;font-size:.86rem;line-height:1.7;color:var(--ink)}

    @media(min-width:681px){
      .case-card{display:grid;grid-template-columns:1fr 1.1fr}
      .case-left{padding:1.6rem 0;display:flex;flex-direction:column}
      .case-top,.case-card h3,.person,.facts,.question,.case-card details{padding-left:1.8rem;padding-right:1.8rem}
      .case-card details{margin-top:auto}
      .outcome-col{border-top:0;border-left:1px solid var(--line-soft)}
      .outcome-row-label{padding:1.6rem 1.8rem .4rem}
      .outcome{padding:1rem 1.8rem}
    }

    @media(max-width:680px){
      .section{width:min(100% - 1.2rem,920px);padding:2rem 0}
      .pager{width:min(100% - 1.2rem,920px)}
      .diff-heading,.effect{padding-left:0}
    }
    /* 桌機版由外層視窗顯示凸出的文件索引標籤，此處內部分頁改為隱藏。 */
    @media(min-width:769px){
      #diff .tabs{display:none}
      #cases .case-controls{display:none}
    }
  </style>
</head>
<body>
  <main>
    <div class="page-view" data-page-view="diff">
    <section id="diff" class="section"><div class="section-number">01</div>
      <div class="tabs" role="tablist" aria-label="選擇比較條文"><button data-article="1" role="tab" aria-selected="true">第 1 條</button><button data-article="34" role="tab" aria-selected="false">第 34 條</button><button data-article="237" role="tab" aria-selected="false">第 237 條</button></div>

  </main>
  <dialog id="effect-dialog" class="effect" aria-labelledby="effect-eyebrow"><div class="effect-dialog-head"><p class="eyebrow" id="effect-eyebrow">法律白話文</p><button type="button" id="effect-dialog-close" aria-label="關閉">×</button></div><p id="detail-plain"></p></dialog>
  <script>
  const articles={
    "1":{title:"第 1 條｜誰受軍事審判",detail:["核心變化","平時現役軍人所犯的軍法罪，改依《刑事訴訟法》由普通司法體系追訴、審判；軍事審判的核心適用範圍縮至戰時。","案件流向：平時軍事案件，由軍事司法移往普通司法。"],rows:[
      {before:[p("deleted","現役軍人犯陸海空軍刑法或其特別法之罪，依本法之規定追訴審判之，","刪除原本的概括管轄","舊法以現役軍人犯軍法罪作為軍事審判的主要管轄基礎，沒有先以平時、戰時切開。","足以涵蓋平時軍法罪的概括規定被移除。"),p("deleted","其在戰時犯陸海空軍刑法或其特別法以外之罪者，亦同。","重寫戰時規則","舊法另處理戰時所犯軍法以外犯罪；新法改用新的平戰架構。","管轄標準改成明列戰時與非戰時。")],after:[p("added","現役軍人戰時犯陸海空軍刑法或其特別法之罪，依本法追訴、處罰。","新增「戰時」限制","「戰時」成為適用軍事審判法的關鍵門檻，顯示2013年改革並未完全廢除軍審。","戰時軍事犯罪仍由軍事司法處理。")]},
      {before:[],after:[p("added","現役軍人非戰時犯下列之罪者，依刑事訴訟法追訴、處罰：","新增非戰時分流","平時軍法案件改交普通司法，不代表軍人不再負刑責。","普通檢察官偵查、普通法院審判。"),p("added","一、陸海空軍刑法第四十四條至第四十六條及第七十六條第一項。\n二、前款以外陸海空軍刑法或其特別法之罪。","列出平時適用範圍","兩款合併處理現役軍人在非戰時所犯的軍法罪。","建立平時由普通司法處理的整體架構。")]},
      {before:[p("same","非現役軍人不受軍事審判。"),p("deleted","但戒嚴法有特別規定者，從其規定。","刪除戒嚴法但書","非現役軍人不受軍審的原則保留，但戒嚴法例外文字被刪除。","條文不再保留此概括例外。")],after:[p("same","非現役軍人不受軍事審判。")]}]},
    "34":{title:"第 34 條｜同一案件怎麼分流",dek:"當一宗案件同時包含不同犯罪事實，修法把整案併入哪一套程序的方向翻轉了。",detail:["管轄方向翻轉","修法前，只要部分犯罪事實應依軍審法審判，整案進入軍事司法；修法後，只要部分應依刑事訴訟法辦理，整案轉入普通司法。","混合案件的預設流向，從軍事司法翻轉為普通司法。"],rows:[{before:[p("deleted","犯罪事實之一部應依本法審判時，全部依本法審判之。","刪除軍審吸收規則","應受軍審的部分犯罪事實，可能把同案其他部分一併帶入軍事司法。","修法前整案方向：軍事審判法。")],after:[p("added","犯罪事實之一部應依刑事訴訟法追訴、審判時，全部依刑事訴訟法追訴、審判之。","新增普通司法吸收規則","只要一部分犯罪事實應由普通司法處理，整案便依刑事訴訟法追訴、審判。","修法後整案方向：普通司法體系。")]}]},
    "237":{title:"第 237 條｜舊案件如何移交",dek:"偵查中、審判中、已確定與執行中的案件，都需要過渡規則。",detail:["建立轉軌機制","2013年修正後，第237條由國安法停止適用條款，改寫為完整的案件移交與分階段施行規則。","制度變動同時作用於正在進行與正在執行的案件。"],rows:[
      {before:[p("deleted","國家安全法第八條第二項自中華民國九十年十月二日停止適用。","刪除原第237條","2013年以前，第237條是關於國家安全法第8條第2項停止適用的規定。","2013年以完整過渡規則取代原文。")],after:[p("added","本法中華民國一百零二年八月六日修正之條文施行前，已依本法開始偵查、審判或執行之第一條第二項案件，依下列規定處理之：","新增過渡規則入口","界定修法前已開始偵查、審判或執行的案件如何轉軌。","進行中的案件不因管轄改變而失去承辦機關。")]},
      {before:[],after:[p("added","一、偵查、審判程序尚未終結者，偵查中案件移送該管檢察官偵查，審判中案件移送該管法院審判。但本法修正施行前已依法定程序進行之訴訟程序，其效力不受影響。","偵查與審判移交","偵查中的案件交普通檢察官，審判中的案件交普通法院；移交前依法完成的程序原則上有效。","軍事檢察 → 普通檢察；軍事法院 → 普通法院。")]},
      {before:[],after:[p("added","二、裁判確定之案件，不得向該管法院上訴或抗告。但有再審或非常上訴之事由者，得依刑事訴訟法聲請再審或非常上訴。","已確定案件的救濟","改制不讓已確定裁判重新取得一般上訴或抗告，但保留再審與非常上訴。","一般救濟不重開；非常救濟保留。")]},
      {before:[],after:[p("added","三、刑事裁判尚未執行或在執行中者，移送該管檢察官指揮執行。","執行中的案件移交","尚未執行或正在執行的刑事裁判，改由普通檢察官指揮執行。","執行權一併移往普通司法。")]},
      {before:[],after:[p("added","本法中華民國一百零二年八月六日修正之條文，除第一條第二項第二款自公布後五個月施行外，自公布日施行。","兩階段施行","多數修正自公布日施行，第1條第2項第2款保留五個月準備期。","制度轉換不是同一天一次完成。")]}]}
  };
  function p(kind,text,label="",effect="",impact=""){return{kind,text,label,effect,impact}}
  const segmentLabels={
